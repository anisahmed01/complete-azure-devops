
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Select Python version'

  - script: |
      python -m pip install --upgrade pip
      pip install -r app/requirements.txt
      pip install pytest
    displayName: 'Install dependencies'

  - script: |
      pytest -v
    displayName: 'Run unit tests'

  - task: Docker@2
    displayName: 'Build and push Docker image to ACR'
    inputs:
      command: 'buildAndPush'
      containerRegistry: 'acr-wif-connection'
      repository: 'complete-azure-devops'
      Dockerfile: 'Dockerfile'
      buildContext: '.'
      tags: |
        $(Build.BuildId)

  - task: AzureCLI@2
    displayName: 'Deploy to Azure Container Apps'
    inputs:
      azureSubscription: 'azure-containerapp-deploy'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az containerapp update \
          --name complete-azure-devops-app \
          --resource-group rg-azure-devops-lab \
          --image aneesazuredevopsacr.azurecr.io/complete-azure-devops:$(Build.BuildId)
